spring.application.name=mes

# DataSource
spring.datasource.url=${MES_DB_URL}
spring.datasource.username=${MES_DB_USERNAME}
spring.datasource.password=${MES_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Server
server.port=${SERVER_PORT}

# Logger
logging.level.root=${LOG_ROOT}
logging.level.com.example=${LOG_MES}

# MyBatis
mybatis.config-location=classpath:mybatis-config.xml
mybatis.mapper-locations=classpath:mappers/*.xml

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=${REDIS_DATABASE}
spring.data.redis.timeout=${REDIS_TIMEOUT}
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# Spring Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=${CACHE_TTL}
spring.cache.redis.key-prefix=mes:cache:
spring.cache.redis.cache-null-values=false

# Spring Session（通过 RedisConfig.sessionRepository() 以编程方式配置）
server.servlet.session.timeout=${SESSION_TIMEOUT}
mes.session.redis.namespace=mes:session
mes.session.redis.flush-mode=ON_SAVE
